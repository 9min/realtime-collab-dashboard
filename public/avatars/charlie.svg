<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#ef4444"/>
    </linearGradient>
  </defs>
  <circle cx="64" cy="64" r="64" fill="url(#bg)"/>
  <!-- face -->
  <circle cx="64" cy="50" r="22" fill="#fde8d8"/>
  <!-- hair - long wavy -->
  <path d="M38 48 Q36 24 64 22 Q92 24 90 48 Q88 30 64 28 Q40 30 38 48Z" fill="#3d1f0a"/>
  <path d="M38 48 Q34 56 36 68 Q38 56 40 48Z" fill="#3d1f0a"/>
