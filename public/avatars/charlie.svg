  <ellipse cx="74" cy="48" rx="3.5" ry="4" fill="#1e1b3a"/>
  <!-- eyelashes -->
  <path d="M50 44 L48 42" stroke="#1e1b3a" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M78 44 L80 42" stroke="#1e1b3a" stroke-width="1.5" stroke-linecap="round"/>
