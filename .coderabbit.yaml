# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

language: ko-KR
tone_instructions: "친절하고 건설적인 톤으로 리뷰. 개선 이유를 함께 설명"
early_access: true

reviews:
  profile: chill
  auto_review:
    enabled: true
    drafts: false
  request_changes_workflow: false
  high_level_summary: true
  high_level_summary_placeholder: "@coderabbitai summary"
  poem: false
  review_status: true
  collapse_walkthrough: false
  path_filters:
    - "!node_modules/**"
    - "!coverage/**"
    - "!.next/**"
    - "!pnpm-lock.yaml"
    - "!src/types/database.ts"
  path_instructions:
    - path: "src/**/*.tsx"
      instructions: |
        React 컴포넌트 리뷰 시 다음을 확인:
        - named export 사용 (default export는 page.tsx, layout.tsx만 허용)
        - 'use client' 디렉티브가 필요한 곳에만 있는지 확인
        - Props는 interface로 정의되었는지 확인
        - any 타입 사용 금지 (unknown 사용)
        - enum 대신 const object + as const 사용
        - 인라인 스타일 금지 (Tailwind CSS 사용)
        - Context API로 상태관리 금지 (Zustand 또는 TanStack Query 사용)
        - useEffect로 데이터 fetch 금지 (TanStack Query 사용)
        - console.log 잔존 여부 확인
        - 매직넘버 사용 금지 (상수화 필요)
        - 중첩 삼항연산자 금지
    - path: "src/hooks/**"
      instructions: |
        커스텀 훅 리뷰 시 다음을 확인:
        - 파일명이 use-kebab-case.ts 형식인지
        - 대응하는 단위 테스트가 있는지 확인 권장
    - path: "src/queries/**"
      instructions: |
        TanStack Query 래퍼 리뷰 시 다음을 확인:
        - Supabase client는 래퍼 함수(createBrowserClient/createServerClient)로 생성하는지
        - fetch() 직접 사용하지 않는지
        - queryKey 네이밍이 일관성 있는지
    - path: "src/stores/**"
      instructions: |
        Zustand 스토어 리뷰 시 다음을 확인:
        - 클라이언트 UI 상태만 관리하는지 (서버 데이터는 TanStack Query)
        - 대응하는 단위 테스트가 있는지 확인 권장
    - path: "src/services/**"
      instructions: |
        서비스 레이어 리뷰 시 다음을 확인:
        - Supabase client를 직접 생성하지 않고 래퍼 함수 사용하는지
        - 순수 함수 형태인지
        - RLS를 신뢰하되, UI용 역할 체크는 별도 구현인지
    - path: "**/*.test.{ts,tsx}"
      instructions: |
        테스트 코드 리뷰 시 다음을 확인:
        - 사용자 관점에서 테스트하는지 (구현 세부사항 X)
        - data-testid 최소화, 접근성 쿼리 우선 (getByRole, getByLabelText)
        - 비동기 테스트에 waitFor 사용하는지
        - Supabase REST는 MSW로 모킹하는지
    - path: "src/lib/supabase/**"
      instructions: |
        Supabase 클라이언트 래퍼 수정 시 주의:
        - Browser용(createBrowserClient)과 Server용(createServerClient) 분리 유지
        - 환경변수는 NEXT_PUBLIC_ prefix 규칙 준수

chat:
  auto_reply: true

knowledge_base:
  learnings:
    scope: auto
