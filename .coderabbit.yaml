# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

language: ko-KR

reviews:
  profile: chill
  auto_review:
    enabled: true
    drafts: false
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  path_filters:
    - "!node_modules/**"
    - "!coverage/**"
    - "!.next/**"
    - "!pnpm-lock.yaml"
    - "!src/types/database.ts"

chat:
  auto_reply: true
